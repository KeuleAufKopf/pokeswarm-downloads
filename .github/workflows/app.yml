# Baut die Electron-Desktop-App (app/) für Windows und Linux, legt die Ergebnisse als Workflow-Artefakte ab und
# veröffentlicht sie als GitHub-Release v<version> (Mirco 03.11.: dann holt sich die App das Update selbst).
# Ablauf: 1. Entwurf v<version> anlegen (falls es das Release noch nicht gibt), 2. Windows und Linux laden hinein,
# 3. erst wenn beide fertig sind, wird der Entwurf veröffentlicht - die Apps sehen nie ein halbes Release.
# Gibt es das Release zur Version in app/package.json schon (veröffentlicht), bleibt es unberührt: ein neues Release
# entsteht nur, wenn die Version steigt.
# 03.11.: vorher legten die zwei Windows-Pakete (Setup + Portable) das Release gleichzeitig an, einer bekam 422 und
# der Upload brach ab - darum legt jetzt ein eigener Schritt das Release vorher an.
name: Desktop-App

on:
  push:
    branches: [electron]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write   # Release anlegen, Dateien hochladen, veröffentlichen

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  entwurf:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Entwurf anlegen (falls es das Release noch nicht gibt)
        run: |
          V=${{ steps.v.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then echo "Release v$V gibt es schon"; else
            gh release create "v$V" --draft --title "$V" --notes "PokéSwarm Desktop-App $V" --target "$GITHUB_SHA"
          fi

  build:
    needs: entwurf
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: --win
            artefakt: PokeSwarm-windows
            dateien: |
              app/dist/*.exe
              app/dist/*.blockmap
              app/dist/latest.yml
          - os: ubuntu-latest
            ziel: --linux
            artefakt: PokeSwarm-linux
            dateien: |
              app/dist/*.AppImage
              app/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Ohne Zertifikat baut electron-builder unsigniert; --publish always lädt in den Entwurf v<version> (releaseType: draft).
      # Ist das Release schon veröffentlicht, überspringt electron-builder das Hochladen.
      - run: npx electron-builder ${{ matrix.ziel }} --publish always   # npm run dist hat --publish never fest drin

      # Platz für späteres Signieren (SignPath Foundation), nur Windows:
      # 1. unsignierte .exe mit actions/upload-artifact hochladen (Schritt-ID merken),
      # 2. signpath/github-action-submit-signing-request mit dieser Artefakt-ID aufrufen,
      # 3. signierte Dateien statt der unsignierten als Artefakt ablegen.
      # Hinweis: Für den NSIS-Installer muss auch die App-exe darin signiert sein, d. h. später
      # erst win-unpacked signieren und dann mit "electron-builder --prepackaged" den Installer bauen.

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefakt }}
          path: ${{ matrix.dateien }}
          if-no-files-found: error
          retention-days: 30

  veroeffentlichen:
    needs: [entwurf, build]
    runs-on: ubuntu-latest
    steps:
      - name: Entwurf veröffentlichen (erst jetzt sehen die Apps das Update)
        run: |
          V=${{ needs.entwurf.outputs.version }}
          if [ "$(gh release view "v$V" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release view "v$V" --json assets --jq '.assets[].name' | grep -qx latest.yml || { echo "latest.yml fehlt - nicht veröffentlicht"; exit 1; }
            gh release edit "v$V" --draft=false --latest
          else echo "Release v$V ist schon veröffentlicht"; fi
